<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instituições · ConectaAção</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-pagina="instituicoes">
  <header class="cabecalho">
    <div class="conteudo">
      <a class="marca" href="/index.html"><span class="marca-icone">C</span>ConectaAção</a>

      <nav class="menu" aria-label="Principal">
        <a class="menu-item" href="/pages/login.html?volta=%2Fpages%2Finstituicoes.html" data-perfil="visitante">Instituições</a>
        <a class="menu-item" href="/pages/instituicoes.html" data-perfil="doador" data-menu="instituicoes" hidden>Instituições</a>
        <span class="menu-item em-breve" aria-disabled="true" data-perfil="doador" hidden>Favoritos<small>em breve</small></span>
        <span class="menu-item em-breve" aria-disabled="true" data-perfil="doador" hidden>Minhas doações<small>em breve</small></span>
        <a class="menu-item" href="/pages/instituicoes.html" data-perfil="instituicao" data-menu="instituicoes" hidden>Instituições</a>
        <span class="menu-item em-breve" aria-disabled="true" data-perfil="instituicao" hidden>Painel da instituição<small>em breve</small></span>
      </nav>

      <div class="acoes-usuario" id="acoes-visitante">
        <a class="link-forte" href="/pages/login.html">Entrar</a>
        <a class="botao" href="/pages/cadastro.html">Criar conta</a>
      </div>
      <div class="acoes-usuario" id="acoes-logado" hidden>
        <div class="usuario">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="usuario-texto">
            <span class="usuario-nome" id="usuario-nome"></span>
            <span class="usuario-papel" id="usuario-papel"></span>
          </span>
        </div>
        <button type="button" class="botao-sair" id="sair">Sair</button>
      </div>
    </div>
  </header>

  <!-- RF-07, RF-08, RF-09: listagem protegida (RF-05), com busca e filtros -->
  <main class="conteudo pagina">
    <div class="pagina-titulo">
      <h1>Instituições</h1>
      <p id="resultado" role="status" aria-live="polite">Carregando instituições...</p>
    </div>

    <form class="filtros" id="filtros" role="search">
      <div class="campo">
        <label for="busca">Buscar</label>
        <input id="busca" name="busca" type="search" placeholder="Nome ou descrição da instituição" autocomplete="off">
      </div>
      <label class="opcao"><input type="checkbox" name="abertas"> Com necessidades abertas</label>
      <label class="opcao"><input type="checkbox" name="verificadas"> Só verificadas</label>
      <button type="reset" class="botao botao-neutro">Limpar</button>
    </form>

    <div class="cards" id="lista"></div>

    <div class="vazio" id="vazio" hidden>
      <strong>Nenhuma instituição com esses filtros</strong>
      <p>Tente outro termo de busca ou desmarque os filtros.</p>
      <button type="button" class="botao" id="limpar-vazio">Limpar filtros</button>
    </div>
  </main>

  <script type="module" src="/js/cabecalho.js"></script>
  <script type="module" src="/js/instituicoes.js"></script>
</body>
</html>
